name: "✨ 機能追加リクエスト"
description: "新しい機能や改善を提案する"
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        新機能のアイデアをありがとうございます。具体的に記入してください。

  - type: textarea
    id: problem
    attributes:
      label: "解決したい課題"
      description: "この機能でどんな問題を解決したいですか？"
      placeholder: "例: 現在カードを並び替えるたびに手動でページを更新する必要があり、不便"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "提案する解決策"
      description: "どんな機能・変更を望んでいますか？"
      placeholder: "例: ドラッグ＆ドロップでカードを並び替えられる機能"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "検討した代替案"
      description: "他に考えたアプローチがあれば記入してください。"

  - type: dropdown
    id: priority
    attributes:
      label: "優先度"
      options:
        - "high — ブロッカー・必須"
        - "medium — あると良い"
        - "low — nice to have"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "受け入れ条件"
      description: "この機能が完成した、と判断できる条件を書いてください。"
      placeholder: |
        - [ ] カードをドラッグして順序を変更できる
        - [ ] 変更はリロード後も保持される
        - [ ] モバイルでも動作する
