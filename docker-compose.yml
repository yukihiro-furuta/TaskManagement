services:
  postgres:
    image: postgres:16
    container_name: task-management-db
    environment:
      POSTGRES_DB: github_demo
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d github_demo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
