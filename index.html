<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タスク管理アプリ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <h1 class="app-title">タスク管理アプリ</h1>
    <span class="total-count">総タスク数: <strong id="total-count">0</strong></span>
  </header>

  <main class="board" id="board"></main>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">カードを追加</h2>
        <button class="btn-close" id="btn-modal-close" aria-label="閉じる">×</button>
      </div>
      <form id="card-form" novalidate>
        <input type="hidden" id="edit-col">
        <input type="hidden" id="edit-id">

        <div class="form-group">
          <label for="input-title">タイトル <span class="required">*</span></label>
          <input type="text" id="input-title" maxlength="100" placeholder="タスク名を入力">
          <span class="field-error" id="error-title" hidden>タイトルを入力してください</span>
        </div>

        <div class="form-group">
          <label for="input-desc">説明文</label>
          <textarea id="input-desc" maxlength="500" rows="3" placeholder="詳細メモ（任意）"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="input-priority">優先度</label>
            <select id="input-priority">
              <option value="high">高</option>
              <option value="mid" selected>中</option>
              <option value="low">低</option>
            </select>
          </div>
          <div class="form-group">
            <label for="input-due">期限</label>
            <input type="date" id="input-due">
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-cancel" id="btn-cancel">キャンセル</button>
          <button type="submit" class="btn btn-primary">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
