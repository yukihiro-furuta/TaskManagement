services:
  postgres:
    image: postgres:16
    container_name: task-management-db
    environment:
      POSTGRES_DB: github_demo
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d github_demo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: task-management-backend:latest
    container_name: task-management-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/github_demo
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: apppassword
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: task-management-frontend:latest
    container_name: task-management-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
